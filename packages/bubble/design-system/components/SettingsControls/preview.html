<!-- @dsCard group="Thiṇai · Settings" height=700 width=900 subtitle="Switches in words, locked safeguards, text size, theme picker" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SettingsControls — preview</title>
<style> body { margin: 0; } .wrap { padding: 24px; display: flex; flex-direction: column; gap: 20px; } .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; } </style>
</head>
<body class="yz-root" data-theme="light" data-tn="mullai">
<div class="wrap"><section class="yz-group" aria-labelledby="sc"><h2 class="yz-group__h" id="sc"><svg class="yz-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 19.5l6-9 4 5.5 2.5-3.5 5.5 7z"/><circle cx="16.5" cy="6.5" r="2.5"/></svg>பார்வை · Seeing and reading</h2><div class="yz-row"><div class="yz-row__text"><svg class="yz-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 19l5-13 5 13M4.9 14.5h6.2"/><path d="M14.5 19l3.25-7.5L21 19M15.6 16.5h4.3"/></svg><span class="yz-row__label"><span class="yz-ta">எழுத்தின் அளவு</span> · Text size</span></div><div class="yz-stepper" role="group" aria-label="Text size"><button aria-label="Smaller text">A−</button><output aria-live="polite">Large</output><button aria-label="Larger text">A+</button></div></div><div class="yz-row"><div class="yz-row__text"><svg class="yz-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 6.5C10 5 7 4.5 3.5 5v13.5c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5V20"/></svg><span class="yz-row__label"><span class="yz-ta">பக்க எண்ணைக் காட்டு</span> · Show page chips</span><span class="yz-row__help">Every answer shows its page.</span></div><button class="yz-switch" role="switch" aria-checked="true" aria-label="Show page chips"><span class="yz-switch__track" aria-hidden="true"></span><span class="yz-switch__word">ஆம் · On</span></button></div><div class="yz-row"><div class="yz-row__text"><svg class="yz-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 9c2.5-3 4.5-3 7 0s4.5 3 7 0 3-2 4-1"/><path d="M3 16l18 0" stroke-dasharray="1 3"/></svg><span class="yz-row__label"><span class="yz-ta">அசைவைக் குறை</span> · Reduce motion</span></div><button class="yz-switch" role="switch" aria-checked="false" aria-label="Reduce motion"><span class="yz-switch__track" aria-hidden="true"></span><span class="yz-switch__word">இல்லை · Off</span></button></div><div class="yz-row"><div class="yz-row__text"><svg class="yz-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="10.5" width="14" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg><span class="yz-row__label"><span class="yz-ta">அனுப்பும் முன் ஒப்புதல்</span> · Ask me before sending</span><span class="yz-lock"><svg class="yz-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="5" y="10.5" width="14" height="10.5" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg>Always on.</span></div><button class="yz-switch" role="switch" aria-checked="true" aria-disabled="true" aria-label="Ask me before sending"><span class="yz-switch__track" aria-hidden="true"></span><span class="yz-switch__word">ஆம் · On</span></button></div><div class="yz-row"><div class="yz-swatches" role="radiogroup" aria-label="Look"><button class="yz-swatch" role="radio" aria-checked="false"><span class="yz-swatch__dot" style="background:var(--tn-kurinji);color:var(--tn-on-pastel)"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1.5 20.5L8 9.5l4 6 3-4 7.5 9z" fill="currentColor"/><circle cx="17.5" cy="5.5" r="1.6" fill="currentColor"/><path d="M17.5 2v1.3M17.5 7.7V9M14 5.5h1.3M19.7 5.5H21M15.2 3.2l.9.9M18.9 6.9l.9.9M15.2 7.8l.9-.9M18.9 4.1l.9-.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span><span class="yz-ta">குறிஞ்சி</span><br>Kurinji</span></button><button class="yz-swatch" role="radio" aria-checked="true"><span class="yz-swatch__dot" style="background:var(--tn-mullai);color:var(--tn-on-pastel)"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><ellipse cx="12" cy="6.6" rx="2.7" ry="4" transform="rotate(0 12 12)" fill="currentColor"/><ellipse cx="12" cy="6.6" rx="2.7" ry="4" transform="rotate(72 12 12)" fill="currentColor"/><ellipse cx="12" cy="6.6" rx="2.7" ry="4" transform="rotate(144 12 12)" fill="currentColor"/><ellipse cx="12" cy="6.6" rx="2.7" ry="4" transform="rotate(216 12 12)" fill="currentColor"/><ellipse cx="12" cy="6.6" rx="2.7" ry="4" transform="rotate(288 12 12)" fill="currentColor"/></svg></span><span><span class="yz-ta">முல்லை</span><br>Mullai</span></button><button class="yz-swatch" role="radio" aria-checked="false"><span class="yz-swatch__dot" style="background:var(--tn-marutham);color:var(--tn-on-pastel)"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21.5V9" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M12 9c-2.2-1.6-2.2-5 0-7 2.2 2 2.2 5.4 0 7zM12 14c-2.6.3-5-1.4-5.6-4.4 2.8-.4 5.1 1.4 5.6 4.4zM12 14c2.6.3 5-1.4 5.6-4.4-2.8-.4-5.1 1.4-5.6 4.4zM12 19c-2.6.3-5-1.4-5.6-4.4 2.8-.4 5.1 1.4 5.6 4.4zM12 19c2.6.3 5-1.4 5.6-4.4-2.8-.4-5.1 1.4-5.6 4.4z" fill="currentColor"/></svg></span><span><span class="yz-ta">மருதம்</span><br>Marutham</span></button><button class="yz-swatch" role="radio" aria-checked="false"><span class="yz-swatch__dot" style="background:var(--tn-neithal);color:var(--tn-on-pastel)"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15.5 2.5a4.5 4.5 0 1 0 5 6.5 3.6 3.6 0 0 1-5-6.5z" fill="currentColor"/><path d="M1.5 15c2.6-2.2 4.7-2.2 7 0s4.6 2.2 7 0 4.6-2.2 7 0M1.5 20c2.6-2.2 4.7-2.2 7 0s4.6 2.2 7 0 4.6-2.2 7 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><span class="yz-ta">நெய்தல்</span><br>Neithal</span></button><button class="yz-swatch" role="radio" aria-checked="false"><span class="yz-swatch__dot" style="background:var(--tn-paalai);color:var(--tn-on-pastel)"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="9" r="3.6" fill="currentColor"/><path d="M12 2v1.6M4.8 9h1.6M17.6 9h1.6M6.9 3.9l1.1 1.1M17.1 3.9L16 5" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/><path d="M1.5 21c3.5-4.5 8-5 11.5-3s6.5 2 9.5.5V21z" fill="currentColor"/></svg></span><span><span class="yz-ta">பாலை</span><br>Paalai</span></button><button class="yz-swatch" role="radio" aria-checked="false"><span class="yz-swatch__dot" style="background:#ffffff;color:#000000"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></span><span><span class="yz-ta">தெளிவு</span><br>High contrast</span></button><button class="yz-swatch" role="radio" aria-checked="false"><span class="yz-swatch__dot" style="background:#111412;color:#f4f2ea"><svg class="yz-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M19.5 15.5A8.5 8.5 0 0 1 8.5 4.5a8.5 8.5 0 1 0 11 11z" fill="currentColor"/><circle cx="17" cy="5" r="1" fill="currentColor"/><circle cx="20.5" cy="9" r=".8" fill="currentColor"/></svg></span><span><span class="yz-ta">இரவு</span><br>Night</span></button></div></div></section></div>
<script>
  document.querySelectorAll('.yz-seg').forEach(function (g) { g.addEventListener('click', function (e) { var b = e.target.closest('.yz-seg__opt'); if (!b) return; g.querySelectorAll('.yz-seg__opt').forEach(function (o) { o.setAttribute(o.hasAttribute('aria-checked') ? 'aria-checked' : 'aria-pressed', String(o === b)); }); }); });
  document.querySelectorAll('.yz-switch').forEach(function (s) { s.addEventListener('click', function () { if (s.getAttribute('aria-disabled') === 'true') return; var on = s.getAttribute('aria-checked') !== 'true'; s.setAttribute('aria-checked', String(on)); var w = s.querySelector('.yz-switch__word'); if (w) w.textContent = on ? 'ஆம் · On' : 'இல்லை · Off'; }); });
  document.querySelectorAll('.yz-swatches').forEach(function (g) { g.addEventListener('click', function (e) { var b = e.target.closest('.yz-swatch'); if (!b) return; g.querySelectorAll('.yz-swatch').forEach(function (o) { o.setAttribute('aria-checked', String(o === b)); }); }); });
  document.querySelectorAll('.yz-stepper').forEach(function (st) { var sizes = ['Default', 'Large', 'Larger', 'Largest'], i = 1, o = st.querySelector('output'); st.querySelectorAll('button').forEach(function (b, k) { b.addEventListener('click', function () { i = Math.max(0, Math.min(sizes.length - 1, i + (k ? 1 : -1))); o.textContent = sizes[i]; document.documentElement.style.fontSize = (100 + i * 12.5) + '%'; }); }); });
</script>
</body>
</html>
