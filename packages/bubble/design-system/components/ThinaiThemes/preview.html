<style>

  .mini .rail span.on { background: var(--tn-panel); box-shadow: 0 3px 0 var(--tn-tint-strong); }
  .mini h3 { margin: 0; font: 800 22px/28px var(--font-tamil); }
  .mini p { margin: 0; font: 700 14px/18px var(--font-body); color: var(--tn-ink-muted); }
  .mini .btns { display: flex; justify-content: space-between; gap: 8px; }
  .mini .yz-btn { min-height: 44px; padding: 0 14px; font-size: 16px; }
